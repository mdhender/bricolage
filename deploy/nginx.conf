# EXAMPLE — the production reverse proxy, as nginx.
#
# Copy to /etc/nginx/sites-available/cms and symlink it into sites-enabled:
#
#     sudo ln -s /etc/nginx/sites-available/cms /etc/nginx/sites-enabled/cms
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
# Pick ONE proxy. This file and deploy/Caddyfile.prod are alternatives, not
# layers. nginx needs certbot and a renewal timer; Caddy does not. Use this if
# you already know nginx or need something it does that Caddy does not.
#
# Certificates come from certbot. Run it in webroot mode AFTER the port 80
# server block below is live, so the challenge has somewhere to land:
#
#     sudo certbot certonly --webroot -w /var/www/certbot -d cms.mdhenderson.com
#
# certbot's apt package installs its own renewal timer. Give it a deploy hook
# so a renewed certificate is actually served:
#
#     sudo mkdir -p /etc/letsencrypt/renewal-hooks/deploy
#     printf '#!/bin/sh\nsystemctl reload nginx\n' \
#       | sudo tee /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
#     sudo chmod +x /etc/letsencrypt/renewal-hooks/deploy/reload-nginx

upstream cmsd {
    # cmsd speaks plain HTTP on loopback and never terminates TLS. The proxy
    # runs on this same droplet, which is why cmsd's default trusted-proxy list
    # (127.0.0.1/32, ::1/128) is exactly right and the unit passes no
    # --trusted-proxy of its own.
    server 127.0.0.1:18443;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cms.mdhenderson.com;

    # Leave this reachable after the first issuance: renewal uses it too.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 LTS ships nginx 1.24, where HTTP/2 is a listen parameter.
    # On 1.25.1 and later this spelling is deprecated and warns; there it is
    # `listen 443 ssl;` plus a separate `http2 on;`. Check `nginx -v` and use
    # the one that matches, rather than both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.mdhenderson.com;

    ssl_certificate     /etc/letsencrypt/live/cms.mdhenderson.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.mdhenderson.com/privkey.pem;

    # TLS 1.3 or better is a requirement of the serving model (DESIGN.md 11),
    # not a preference. With TLSv1.3 alone, ssl_ciphers does not apply -- the
    # 1.3 suites are fixed -- so there is deliberately no cipher line here.
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No OCSP stapling. Let's Encrypt has retired its OCSP responders, so
    # `ssl_stapling on` with these certificates staples nothing and merely adds
    # a failing fetch to every reload. Revocation for this certificate is
    # carried by CRL and by its 90-day lifetime.

    # HSTS belongs to the proxy; cmsd emits none. `always` is load-bearing --
    # without it the header is dropped on error responses. Add includeSubDomains
    # only once every hostname under mdhenderson.com can serve HTTPS; the
    # browser remembers this for a year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;

    # There are no file uploads anywhere in this system -- request bodies are
    # JSON documents and HTML form posts. This is generous for both and still
    # small enough to be a limit.
    client_max_body_size 2m;

    access_log /var/log/nginx/cms.access.log;
    error_log  /var/log/nginx/cms.error.log;

    location / {
        proxy_pass http://cmsd;

        # keepalive to the upstream needs HTTP/1.1 and an empty Connection.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The four headers cmsd reads. It honours them only from its
        # trusted-proxy CIDRs, so a client that sets its own X-Forwarded-For is
        # ignored -- but only because the value below overwrites nothing it
        # should trust: $proxy_add_x_forwarded_for appends the real peer to
        # whatever the client sent, and cmsd resolves the client from the right
        # end of that list.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Origin and Sec-Fetch-* are NOT set here on purpose. nginx passes
        # client request headers to the upstream unmodified unless a
        # proxy_set_header names them, and net/http.CrossOriginProtection reads
        # exactly those two to decide whether a cookie-authenticated write is
        # CSRF (DESIGN.md 11, requirement 4). Naming them here -- even to
        # "pass them through" -- is how you break every form in the UI. Note
        # also that nginx drops request headers containing underscores by
        # default; every header this system reads uses hyphens, so leave
        # underscores_in_headers at its default of off.

        # cmsd's graceful drain is bounded at 30s (config.DefaultDrainTimeout).
        # Do not cut a request off before the server would have finished it.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # The proxy's own liveness probe. cmsd answers this without touching the
    # database, so it says the process is up, not that the system is well;
    # `cmsdb check` is the one that answers that.
    location = /healthz {
        proxy_pass http://cmsd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
